<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mission: Thank You!</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
  <style>
    :root {
      --sky1: #0d0b2e;
      --sky2: #2b1a5e;
      --ink: #fff7e0;
      --gold: #ffd54a;
      --pink: #ff7eb6;
      --cyan: #5ee7ff;
      --panel: #1a1648;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --sky1: #0d0b2e
      }
    }

    :root[data-theme="dark"] {
      --sky1: #0d0b2e
    }

    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100%;
      font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--sky1), var(--sky2));
      overflow-x: hidden
    }

    #stars,
    #fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden
    }

    #stars i {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      animation: tw 3s ease-in-out infinite
    }

    @keyframes tw {
      50% {
        opacity: .2
      }
    }

    #fx {
      z-index: 20
    }

    #fx b {
      position: absolute;
      font-weight: 400;
      animation: fall linear forwards
    }

    @keyframes fall {
      to {
        transform: translateY(112vh) rotate(360deg)
      }
    }

    main {
      position: relative;
      max-width: 480px;
      margin: 0 auto;
      padding: 22px 18px 120px;
      min-height: 100vh
    }

    h1 {
      font-size: clamp(34px, 10vw, 48px);
      line-height: 1;
      margin: 2vh 0 6px;
      font-weight: 800;
      color: var(--gold)
    }

    .sub {
      margin: 0;
      font-size: 18px
    }

    .prog {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 14px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .12);
      font-size: 16px
    }

    .map {
      position: relative;
      height: 430px;
      margin-top: 10px
    }

    .pl {
      position: absolute;
      border: 0;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: inset -14px -12px 0 rgba(0, 0, 0, .22), 0 0 40px rgba(255, 255, 255, .12);
      animation: fl 5s ease-in-out infinite
    }

    .pl span {
      font-size: 46px;
      line-height: 1
    }

    .pl small {
      font-size: 17px
    }

    .pl:active {
      transform: scale(.94)
    }

    .pl.done::after {
      content: "✔";
      position: absolute;
      top: 2px;
      right: 6px;
      font-size: 24px;
      background: var(--gold);
      color: #3a2600;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      line-height: 34px;
      text-align: center
    }

    @keyframes fl {
      50% {
        transform: translateY(-12px)
      }
    }

    .p1 {
      width: 150px;
      height: 150px;
      left: 0;
      top: 10px;
      background: radial-gradient(circle at 35% 30%, #ffb86b, #e8602c)
    }

    .p2 {
      width: 132px;
      height: 132px;
      right: 0;
      top: 140px;
      background: radial-gradient(circle at 35% 30%, #ff9fd2, #a63ec0);
      animation-delay: -1.5s
    }

    .p3 {
      width: 146px;
      height: 146px;
      left: 30px;
      top: 278px;
      background: radial-gradient(circle at 35% 30%, #8ef0ff, #2c7be0);
      animation-delay: -3s
    }

    .ring {
      position: absolute;
      left: -12px;
      right: -12px;
      top: 55%;
      height: 26px;
      border: 4px solid rgba(255, 255, 255, .35);
      border-radius: 50%;
      transform: rotate(-14deg);
      pointer-events: none
    }

    .launch {
      display: none;
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      max-width: 444px;
      margin: auto;
      padding: 14px;
      border: 0;
      border-radius: 99px;
      background: var(--gold);
      color: #3a2600;
      font: 800 24px "Baloo 2", sans-serif;
      box-shadow: 0 6px 0 #b58900;
      cursor: pointer;
      z-index: 5;
      animation: pulse 1.4s ease-in-out infinite
    }

    .launch.show {
      display: block
    }

    @keyframes pulse {
      50% {
        transform: scale(1.04)
      }
    }

    :focus-visible {
      outline: 4px solid var(--cyan);
      outline-offset: 3px
    }

    /* sheet */
    .veil {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      z-index: 10
    }

    .veil.on {
      opacity: 1;
      pointer-events: auto
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 480px;
      margin: auto;
      background: var(--panel);
      border: 3px solid var(--cyan);
      border-bottom: 0;
      border-radius: 28px 28px 0 0;
      padding: 18px 18px calc(22px + env(safe-area-inset-bottom, 0px));
      max-height: 82vh;
      overflow-y: auto;
      transform: translateY(105%);
      transition: transform .35s cubic-bezier(.2, 1, .3, 1);
      z-index: 11
    }

    .sheet.on {
      transform: none
    }

    .sheet h2 {
      margin: 0 0 8px;
      font-size: 30px;
      color: var(--gold)
    }

    .x {
      position: absolute;
      top: 10px;
      right: 14px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, .15);
      color: #fff;
      font-size: 22px;
      cursor: pointer
    }

    .say {
      background: #fff7e0;
      color: #2b1a5e;
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 22px;
      line-height: 1.3;
      margin: 10px 0;
      min-height: 70px
    }

    .say b {
      display: block;
      font-size: 24px
    }

    .row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px
    }

    .g {
      aspect-ratio: 1;
      font-size: 36px;
      border-radius: 18px;
      border: 3px dashed var(--cyan);
      background: rgba(255, 255, 255, .08);
      cursor: pointer
    }

    .g.seen {
      border-style: solid;
      border-color: var(--gold);
      background: rgba(255, 213, 74, .18)
    }

    .big {
      display: block;
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 99px;
      background: var(--pink);
      color: #33062a;
      font: 800 21px "Baloo 2", sans-serif;
      box-shadow: 0 5px 0 #b3487f;
      cursor: pointer;
      margin-top: 8px
    }

    .big:active {
      transform: translateY(4px);
      box-shadow: none
    }

    .cap {
      margin: 8px 0 0;
      text-align: center;
      font-size: 16px;
      opacity: .85
    }

    .log p {
      margin: 0 0 8px;
      padding: 10px 14px;
      border-radius: 16px 16px 16px 4px;
      background: rgba(255, 255, 255, .12);
      font-size: 21px;
      line-height: 1.3;
      animation: in .3s both
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(8px)
      }
    }

    /* finish */
    .end {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: linear-gradient(180deg, var(--sky1), var(--sky2));
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center
    }

    .end.on {
      display: flex
    }

    .badge {
      max-width: 420px;
      background: #fff7e0;
      color: #2b1a5e;
      border: 6px double #e0a800;
      border-radius: 26px;
      padding: 26px 18px;
      box-shadow: 0 0 60px rgba(255, 213, 74, .4)
    }

    .badge .r {
      font-size: 70px;
      line-height: 1;
      animation: up 2.2s ease-out both
    }

    @keyframes up {
      from {
        transform: translateY(70vh) rotate(0)
      }

      to {
        transform: none
      }
    }

    .badge h2 {
      font-size: 34px;
      margin: 8px 0;
      line-height: 1.05
    }

    .badge p {
      margin: 6px 0;
      font-size: 20px
    }

    .badge button {
      margin-top: 10px;
      border: 0;
      border-radius: 99px;
      background: #5b3fd1;
      color: #fff;
      padding: 10px 22px;
      font: 700 18px "Baloo 2", sans-serif;
      cursor: pointer
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div id="stars" aria-hidden="true"></div>
  <div id="fx" aria-hidden="true"></div>
  <main>
    <h1 id="title"></h1>
    <p class="sub">Your students sent you on a secret mission. Visit all 3 planets!</p>
    <span class="prog" id="prog">Planets visited: 0 / 3</span>
    <div class="map">
      <div class="ring"></div>
      <button class="pl p1" data-p="gifts"><span>🎁</span><small>Gift Planet</small></button>
      <button class="pl p2" data-p="msg"><span>💌</span><small>Message Moon</small></button>
      <button class="pl p3" data-p="wish"><span>🌠</span><small>Wish Star</small></button>
    </div>
  </main>
  <button class="launch" id="launch">🚀 Launch the rocket!</button>
  <div class="veil" id="veil"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"><button class="x" id="close"
      aria-label="Close">✕</button>
    <div id="sc"></div>
  </div>
  <div class="end" id="end">
    <div class="badge">
      <div class="r">🚀</div>
      <h2>Mission complete!</h2>
      <p>Our teacher</p>
      <p style="font-size:32px;font-weight:800;color:#c2185b" id="eName"></p>
      <p>is the brightest star in our whole galaxy. Thank you for everything. 💛</p>
      <p><b id="eFrom"></b></p><button id="back">Back to space</button>
    </div>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var TO = (q.get("to") || "Teacher").slice(0, 40);   // ?to=Ma'am Santos&from=Mia
      var FROM = (q.get("from") || "Your student").slice(0, 40);
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var $ = function (s) { return document.querySelector(s) };
      var done = { gifts: 0, msg: 0, wish: 0 };
      $("#title").textContent = "Mission: Thank You, " + TO + "!";
      $("#eName").textContent = TO; $("#eFrom").textContent = "— " + FROM;
      for (var i = 0; i < 45; i++) { var s = document.createElement("i"); s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%"; s.style.animationDelay = Math.random() * 3 + "s"; s.style.opacity = .4 + Math.random() * .6; $("#stars").appendChild(s) }
      function rain(list, n) { if (reduce) return; for (var i = 0; i < n; i++) { var b = document.createElement("b"); b.textContent = list[i % list.length]; b.style.left = Math.random() * 100 + "%"; b.style.top = "-40px"; b.style.fontSize = (18 + Math.random() * 16) + "px"; b.style.animationDuration = (2.5 + Math.random() * 2.5) + "s"; b.style.animationDelay = Math.random() * .8 + "s"; $("#fx").appendChild(b); setTimeout(function (e) { e.remove() }, 6500, b) } }
      function open(html, init) { $("#sc").innerHTML = html; $("#sheet").classList.add("on"); $("#veil").classList.add("on"); init() }
      function shut() { $("#sheet").classList.remove("on"); $("#veil").classList.remove("on"); refresh() }
      function refresh() {
        var n = 0;["gifts", "msg", "wish"].forEach(function (k) { var b = $('[data-p="' + k + '"]'); b.classList.toggle("done", !!done[k]); if (done[k]) n++ });
        $("#prog").textContent = "Planets visited: " + n + " / 3";
        $("#launch").classList.toggle("show", n === 3);
      }
      $("#close").onclick = shut; $("#veil").onclick = shut;
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") shut() });
      document.querySelector(".map").addEventListener("click", function (e) { var b = e.target.closest("[data-p]"); if (!b) return; ({ gifts: gifts, msg: msg, wish: wish })[b.dataset.p]() });

      /* Gift Planet */
      function gifts() {
        var G = [["🌟", "A shiny star", "For lighting up our classroom every single day."], ["🚀", "A rocket", "For launching our big ideas way up high."], ["🪐", "A planet", "For showing us there is a whole world to learn."], ["🌙", "A moon", "For waiting patiently while we figured it out."]];
        var seen = {};
        open('<h2>Gift Planet</h2><div class="row" id="gr"></div><div class="say" id="gs">Tap a gift to open it!</div><div class="cap" id="gc"></div>', function () {
          G.forEach(function (g, i) {
            var b = document.createElement("button"); b.className = "g"; b.textContent = "🎁"; b.setAttribute("aria-label", "Gift " + (i + 1));
            b.onclick = function () {
              b.textContent = g[0]; b.classList.add("seen"); seen[i] = 1; $("#gs").innerHTML = "<b></b><span></span>"; $("#gs").firstChild.textContent = g[0] + " " + g[1]; $("#gs").lastChild.textContent = g[2];
              var n = Object.keys(seen).length; $("#gc").textContent = n + " of 4 opened"; if (n === 4) { done.gifts = 1; rain(["⭐", "✨"], 25) }
            };
            $("#gr").appendChild(b)
          });
        });
      }
      /* Message Moon */
      function msg() {
        var M = ["Hello " + TO + ", this message came from the moon! 🌙", "You never get tired of our million questions.", "You make hard lessons feel like little adventures.", "When I feel lost, you are my map.", "Thank you for being our captain!", "Happy Teachers' Day! — " + FROM + " 💛"];
        var i = 0;
        open('<h2>Message Moon</h2><div class="log" id="lg"></div><button class="big" id="nx">Next message ➜</button>', function () {
          function add() { var p = document.createElement("p"); p.textContent = M[i++]; $("#lg").appendChild(p); if (i >= M.length) { $("#nx").style.display = "none"; done.msg = 1; rain(["💛", "✨"], 20) } }
          add(); $("#nx").onclick = add;
        });
      }
      /* Wish Star */
      function wish() {
        var W = ["You are the best teacher in the universe!", "You are super kind and super smart.", "Your smile makes our class happy.", "You are my hero. 🦸", "Thank you for believing in me.", "You make school my favorite place."];
        var n = 0, order = W.slice().sort(function () { return Math.random() - .5 });
        open('<h2>Wish Star</h2><p style="margin:0">Make a wish and catch a shooting star!</p><div class="say" id="ws">🌠</div><button class="big" id="wb">Make a wish ✨</button><div class="cap" id="wc">Catch 3 stars</div>', function () {
          $("#wb").onclick = function () {
            rain(["🌠", "⭐"], 8); $("#ws").textContent = order[n % order.length]; n++;
            $("#wc").textContent = n < 3 ? "Stars caught: " + n + " of 3" : "You caught them all! 🎉";
            if (n >= 3) { done.wish = 1 }
          };
        });
      }
      $("#launch").onclick = function () { $("#end").classList.add("on"); rain(["⭐", "🎈", "💛", "✨", "🌟"], 70) };
      $("#back").onclick = function () { $("#end").classList.remove("on") };
      refresh();
    })();
  </script>
</body>

</html>
